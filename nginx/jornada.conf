# Jornada — TLS na borda (SDD §10.3). INSTALADO por deploy/tls_setup.sh como
# /etc/nginx/sites-available/jornada.conf. NÃO editar no servidor: o próximo
# tls_setup.sh sobrescreve o arquivo inteiro.
#
# Este nginx é o do HOST (nginx/1.24, Ubuntu, já instalado e já servindo a porta 80).
# Ele NÃO substitui o nginx do serviço `web` (frontend/nginx.conf), que continua dentro
# do container servindo o SPA e fazendo proxy de /api/ para api:8000. A divisão é:
#
#   internet --443/TLS--> nginx do HOST --HTTP loopback--> 127.0.0.1:8050 (web) --> api
#
# Por que loopback e não a rede do compose: `web` publica 8050 no host, então
# 127.0.0.1:8050 não depende do nome da rede do compose e sobrevive a `docker compose
# down && up` (o endereço interno do container muda; 127.0.0.1 não). É o MESMO endereço
# que scripts/purge_retencao.sh já usa — uma cadeia só, não duas.
#
# ATENÇÃO (o item que o TLS não resolve sozinho): enquanto o compose publicar
# `8050:80` em 0.0.0.0, a porta 8050 continua atendendo HTTP EM CLARO ao lado do 443, e
# o Docker publica ATRAVESSANDO o ufw (regras na FORWARD/DOCKER-USER, não na INPUT — é
# por isso que 8050 responde da internet hoje com o ufw ativo e sem regra para 8050).
# Terminar TLS aqui e deixar 8050 aberto é trocar a fechadura da porta e deixar a
# janela aberta. O trecho de docker-compose.prod.yml que fecha isso está no relatório
# desta frente (bind em 127.0.0.1) — outra frente é dona daquele arquivo.

# ---------------------------------------------------------------- :80 → ACME + redirect
server {
    listen 80;
    listen [::]:80;
    server_name vps.falagaiotto.com.br;

    # O desafio HTTP-01 do Let's Encrypt precisa ser servido em HTTP puro, ANTES do
    # redirect — daí esta location vir primeiro e não redirecionar. `certonly --webroot`
    # escreve o token aqui; nginx nunca é parado para renovar.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- :443 → aplicação
server {
    # `listen ... http2` e NÃO a diretiva `http2 on;`: esta VPS roda nginx/1.24.0, e
    # `http2 on;` só existe a partir do 1.25.1 — no 1.24 é "unknown directive" e o
    # `nginx -t` reprova o arquivo inteiro. Num host que serve seis outros projetos,
    # isso significa que NENHUM deles recebe configuração nova até alguém desfazer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vps.falagaiotto.com.br;

    ssl_certificate     /etc/letsencrypt/live/vps.falagaiotto.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.falagaiotto.com.br/privkey.pem;
    # Gerados pelo pacote certbot; o tls_setup.sh confere que existem antes de habilitar
    # este arquivo (referência a certificado inexistente = nginx não recarrega, e um
    # nginx que não recarrega derruba TODOS os sites deste host, não só o Jornada).
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — LEIA O RELATÓRIO ANTES DE AUMENTAR ESTE VALOR.
    # HSTS é escopado por HOST e ignora a PORTA (RFC 6797 §8.3). Este host serve outros
    # projetos em http://vps.falagaiotto.com.br:8080 (agente_caddy) e :8010 (vertice) —
    # e a Langfuse em :13000. Assim que um navegador vir este header, ele passa a forçar
    # https em TODAS essas portas e quebra o que ainda for HTTP, sem aviso e sem que
    # limpar o cache resolva (só chrome://net-internals/#hsts resolve).
    # Por isso começa em 300s (5 min): dá para desfazer. Só suba para 31536000 depois de
    # confirmar que nada mais neste hostname depende de HTTP. NUNCA use includeSubDomains
    # aqui: pegaria *.falagaiotto.com.br inteiro, inclusive nomes de terceiros.
    add_header Strict-Transport-Security "max-age=300" always;

    # Cabeçalhos de origem: PII real em tela (§10.2) — nada de embutir em iframe alheio
    # e nada de referer vazando URL com id de OS para fora.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Ateliê/RAG sobem arquivo; o default de 1m devolveria 413 sem explicação.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr e NÃO $proxy_add_x_forwarded_for. Este server{} é a BORDA: o que
        # chega aqui vem da internet, então o X-Forwarded-For recebido é texto escolhido
        # pelo atacante. `$proxy_add_x_forwarded_for` ACRESCENTA o IP real ao que veio,
        # preservando a mentira na FRENTE da lista — medido nesta topologia:
        #     curl -H 'X-Forwarded-For: 1.2.3.4'  →  XFF = "1.2.3.4, <ip real>"
        # e quem lê o header pelo caminho usual (`split(",")[0]`) lê 1.2.3.4. Na borda,
        # sobrescrever é o único comportamento correto: a lista COMEÇA aqui.
        # Ver a nota "IP DO CLIENTE" no fim deste arquivo — hoje a aplicação ainda não
        # lê este header, e enquanto não ler o limite por IP do login não distingue
        # ninguém.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # X-Forwarded-Proto=https é o que permite à aplicação saber que a borda é TLS
        # mesmo recebendo HTTP no loopback (é o que um `secure_scheme` futuro leria).
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # > LLM_TIMEOUT_S (300s): agente no hub pode levar minutos. Igual ao
        # frontend/nginx.conf — se a borda cortar em 60s (default), o usuário vê 504 no
        # meio da conversa e o timeout de dentro nunca chega a ser exercido.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_buffering off;   # streaming dos agentes chega token a token
    }
}

# ------------------------------------------------------------------- IP DO CLIENTE
# MEDIDO nesta topologia (nginx da borda → :8050 → nginx do container `web` → api:8000),
# com um servidor que devolve o peer TCP que a aplicação enxerga:
#
#   direto na api ....... request.client.host = <ip de quem chamou>
#   via `web` (PROD) .... request.client.host = <ip do container web>  ← SEMPRE o mesmo
#
# Ou seja: a aplicação NUNCA vê o IP do usuário em produção, nem antes deste arquivo
# existir. Quem termina a conexão TCP com o uvicorn é o nginx do container `web`, e é o
# endereço DELE que chega em `request.client.host`. Não é efeito do TLS — é efeito de
# haver um proxy, que já havia.
#
# Consequência para o limite de login por IP (backend/app/middleware_limite.py): com
# `CONFIAR_EM_X_FORWARDED_FOR = False` ele agrupa TODO MUNDO num balde só. Os tetos
# (10 hashes/60s, 20 recusas/900s) deixam de ser "por IP" e viram teto GLOBAL da
# plataforma — o 11º login legítimo do minuto leva 429, e um atacante sozinho tranca a
# porta de todos em vez de ser trancado. É o oposto do efeito pretendido.
#
# Este arquivo entrega a metade que é dele: `X-Real-IP`/`X-Forwarded-For` = $remote_addr,
# não forjáveis porque a borda SOBRESCREVE. Faltam duas peças que NÃO são desta frente,
# e as três só valem juntas (ver o relatório):
#   1. `frontend/nginx.conf` precisa repassar o header recebido (`$http_x_forwarded_for`)
#      em vez de acrescentar, para a cadeia não ganhar um salto a cada hop;
#   2. a aplicação precisa confiar no header SÓ quando o peer é o proxy conhecido;
#   3. a 8050 precisa fechar em 127.0.0.1 no docker-compose.prod.yml — enquanto ela
#      atender a internet, dá para pular a borda e forjar o header à vontade, e aí
#      confiar nele é PIOR que não confiar.
# Enquanto 1–3 não entrarem, o correto é seguir com `CONFIAR_EM_X_FORWARDED_FOR = False`
# e saber que o limite é global, não por IP.

# ------------------------------------------------- :13443 → Langfuse (§10.8) sob TLS
# Por que uma PORTA e não um subdomínio ou um /langfuse: `jornada.falagaiotto.com.br`
# não existe no DNS (conferido: NXDOMAIN) e criar DNS estava fora do combinado; e o
# Langfuse v2 é Next.js sem basePath — servi-lo sob um prefixo quebra os assets. Porta
# alta com o MESMO certificado é o que funciona sem DNS novo.
#
# RECOMENDAÇÃO (relatório): com PII real nos prompts, o trace do Langfuse passa a ser
# dado pessoal. O certo é NÃO publicar :13000/:13443 na internet e chegar por túnel SSH
# (`ssh -L 13000:127.0.0.1:13000 root@vps`). Este bloco existe para o caso de o dono
# querer manter a UI acessível; se optar pelo túnel, não instale este server{} e não
# abra 13443 no ufw.
server {
    listen 13443 ssl http2;
    listen [::]:13443 ssl http2;
    server_name vps.falagaiotto.com.br;

    ssl_certificate     /etc/letsencrypt/live/vps.falagaiotto.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.falagaiotto.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # borda: sobrescreve, ver :443
        proxy_set_header X-Forwarded-Proto https;
        # Upgrade: o Next.js do Langfuse usa websocket para live updates; sem estes dois
        # a UI carrega e fica "quase viva" (nenhum erro na tela, nada atualiza).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 320s;
    }
}
