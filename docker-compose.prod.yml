# Jornada — deploy de demonstração (VPS) · porta pública 8050
# Uso: criar .env com APP_SECRET (openssl rand -hex 32) e:
#   docker compose -f docker-compose.prod.yml up -d --build
# Nota: persistência PostgreSQL (A7 — service `db`, volume nomeado; a api roda
# `alembic upgrade head` no start, como no compose dev). O hub LLM da Claro só
# responde de dentro da rede Claro — fora dela a IA degrada para 503 + modo manual
# (§10.6), o restante da plataforma funciona normalmente com a OS demo semeada
# (seeds idempotentes: restart não duplica — upsert por uuid5, §11.4/A15).
#
# RETENÇÃO (§10.4): o purge NÃO tem scheduler na aplicação — de propósito. Um worker a
# mais traria lease/retry/fuso e um novo modo de falha silenciosa, que é justamente
# como o §10.4 ficou sem consumidor até o UAT #5. O agendamento é cron do HOST, e a
# rota é idempotente e dry-run por default (`?aplicar=true` para valer).
#
# ATENÇÃO ao ler este bloco: aqui NÃO mora nenhuma linha de cron. Até o F04 morava — um
# `curl` de exemplo em comentário — e ninguém a instalava (não havia hit de `cron` em
# backend/Dockerfile, frontend/Dockerfile, .github/workflows/ci.yml nem deploy/deploy.sh).
# Comentário não instala nada, e um comentário que PARECE um controle é pior do que
# controle nenhum: a auditoria o conta como existente. Quem instala o cron agora é
# `deploy/deploy.sh` (escreve /etc/cron.d/jornada-purge e confere se há daemon de cron
# vivo); quem executa é `scripts/purge_retencao.sh`. Fora daqui, só documentação (README).
name: jornada

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jornada
      POSTGRES_PASSWORD: ${JORNADA_DB_PASSWORD:-jornada}
      POSTGRES_DB: jornada
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jornada -d jornada"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}   # A22 · version-stamp → GET /healthz.sha
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://jornada:${JORNADA_DB_PASSWORD:-jornada}@db:5432/jornada
      # ------------------------------------------------------------------------
      # MODO DO AMBIENTE — a decisão que este arquivo NÃO toma mais sozinho
      # ------------------------------------------------------------------------
      # Era `APP_ENV: dev` fixo, com o comentário "demo pública, dados sintéticos".
      # Enquanto isso é verdade, o custo é conhecido e aceito: em `dev` os tokens
      # `dev-<papel>`/`portal-dev` VALEM (app/auth.py `tokens_dev_ativos`), e eles são
      # seis strings publicadas neste repositório. Num host aberto à internet isso é
      # uma credencial de ADMINISTRADOR de conhecimento público — não uma senha fraca,
      # uma senha divulgada. O front já não as usa (a SPA entra por sessão desde a
      # emenda E04): quem as usa é quem souber montar um curl.
      #
      # Por isso o valor deixa de ter default: quem sobe DECLARA o modo no `.env` do
      # servidor, do mesmo jeito que já declara o APP_SECRET. Ambiente permissivo por
      # omissão é como se chega em produção sem perceber que se chegou.
      #
      # Ordem recomendada da virada (ver o relatório da frente 3):
      #   `APP_ENV=prod` + `SESSION_COOKIE_SECURE=true` + TLS na frente + `DEMO_MODE=false`
      # entram no MESMO deploy, ANTES do primeiro dado real. Separá-los só troca um
      # buraco por outro: prod sem TLS troca a credencial publicada por uma credencial
      # que viaja em claro; TLS sem prod deixa a credencial publicada valendo, agora
      # sobre um canal cifrado. A demo, se tiver de sobreviver, sobrevive num deploy
      # SEPARADO que nunca vê PII — não mantendo a caixa de produção em `dev`.
      APP_ENV: ${APP_ENV:?defina APP_ENV no .env do servidor (dev|homolog|prod) — ver o bloco acima}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env (openssl rand -hex 32)}
      DEFAULT_TENANT: torre-movel
      # Base pública do FRONT — é o que vai DENTRO do link mágico de aprovação
      # (api/v1/portoes.py monta `${WEB_BASE_URL}/aprovacao/{token}`). Sem esta linha o
      # backend usava o default de `config.py`, `http://localhost:5173`: todo link
      # gerado na VPS apontava para a máquina de quem clicou. Ajustar junto com o TLS
      # (vira https:// e sai a porta).
      WEB_BASE_URL: ${WEB_BASE_URL:-http://vps.falagaiotto.com.br:8050}
      # Cookie de sessão só com `Secure` DEPOIS do TLS: antes dele o navegador
      # simplesmente não envia o cookie e o login some (ver a nota em config.py).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Default FECHADO: as seeds §11.4 são dado sintético de demonstração, e o lugar
      # errado para elas é um tenant que vai conter PII real. Em `APP_ENV=prod` são
      # ignoradas de qualquer jeito (app/main.py), mas o default aqui não pode depender
      # disso — a demo liga explicitamente `DEMO_MODE=true` no `.env`.
      DEMO_MODE: ${DEMO_MODE:-false}
      # Bootstrap do root (§8-M0 · G01). Os valores vivem SÓ no `.env` do servidor —
      # nunca no repositório, nunca no CI. Idempotente: se a conta já existe, o boot não
      # toca na senha (quem já trocou não é resetado). Sem as duas variáveis, o boot
      # segue normalmente e nenhum root é criado — a aplicação não quebra por isso.
      JORNADA_ROOT_EMAIL: ${JORNADA_ROOT_EMAIL:-}
      JORNADA_ROOT_SENHA: ${JORNADA_ROOT_SENHA:-}
      # Credencial de MÁQUINA do purge §10.4 (F04). O cron não tem sessão nem usuário;
      # este token é aceito SÓ pela rota do purge (api/v1/admin.py::ator_do_purge) e só
      # quando tem ≥32 caracteres. Gerado pelo deploy no .env do servidor — vazio aqui
      # significa porta FECHADA (a rota volta a exigir dpo/admin humano), nunca aberta.
      JORNADA_PURGE_TOKEN: ${JORNADA_PURGE_TOKEN:-}
      LLM_120B_BASE_URL: https://hub-gpus.claro.com.br/gpt120/v1
      LLM_120B_MODEL: openai/gpt-oss-120b
      LLM_20B_BASE_URL: https://hub-gpus.claro.com.br/gpt20/v1
      LLM_20B_MODEL: openai/gpt-oss-20b
      LLM_API_KEY: not-needed
      LLM_TIMEOUT_S: "300"
      LLM_DEGRADED_MODE: auto
      # A11 — RAG (§7.4): o hub de embeddings responde da VPS; a seed dicionario_dados
      # é ingerida no boot (sem hub → pulada com log, boot intacto).
      EMBED_BASE_URL: https://hub-gpus.claro.com.br/embed06b/v1
      EMBED_MODEL: Qwen/Qwen3-Embedding-0.6B
      EMBED_DIM: "1024"
      EMBED_TIMEOUT_S: "30"
      LANGFUSE_ENABLED: "true"
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PK:?defina LANGFUSE_PK no .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SK:?defina LANGFUSE_SK no .env}
      SFMC_AUTH_URL: http://mock-sfmc:8080/v2/token
      SFMC_REST_URL: http://mock-sfmc:8080/rest
      SFMC_SOAP_URL: http://mock-sfmc:8080/soap
      SFMC_CLIENT_ID: mock
      SFMC_CLIENT_SECRET: mock
      SFMC_ACCOUNT_MID: mock
      DC_AUTH_URL: http://mock-datacloud:8081/oauth/token
      DC_API_URL: http://mock-datacloud:8081/api/v2
      DC_CLIENT_ID: mock
      DC_CLIENT_SECRET: mock
    depends_on:
      db:
        condition: service_healthy
      mock-sfmc:
        condition: service_started
      mock-datacloud:
        condition: service_started

  mock-sfmc:
    build: ./mocks/sfmc-server
    restart: unless-stopped

  mock-datacloud:
    build:
      context: ./mocks
      dockerfile: datacloud-server/Dockerfile
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        GIT_SHA: ${GIT_SHA:-dev}   # A22 · version-stamp → rodapé do shell
    restart: unless-stopped
    ports:
      - "8050:80"
    depends_on:
      - api

  # ---- Observabilidade dos agentes (Langfuse §10.8) — UI pública em :13000 ----
  db-langfuse:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?defina LANGFUSE_DB_PASSWORD no .env}
      POSTGRES_DB: langfuse
    volumes:
      - db-langfuse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      db-langfuse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?}@db-langfuse:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://vps.falagaiotto.com.br:13000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?defina LANGFUSE_NEXTAUTH_SECRET no .env}
      SALT: ${LANGFUSE_SALT:?defina LANGFUSE_SALT no .env}
      TELEMETRY_ENABLED: "false"
      AUTH_DISABLE_SIGNUP: "true"          # UI pública: só o usuário provisionado entra
      LANGFUSE_INIT_ORG_ID: jornada
      LANGFUSE_INIT_ORG_NAME: Jornada
      LANGFUSE_INIT_PROJECT_ID: jornada-demo
      LANGFUSE_INIT_PROJECT_NAME: jornada-demo
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PK:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SK:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_EMAIL:?defina LANGFUSE_INIT_EMAIL no .env}
      LANGFUSE_INIT_USER_NAME: Sergio
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_PASSWORD:?defina LANGFUSE_INIT_PASSWORD no .env}
    ports:
      - "13000:3000"

volumes:
  db-data:
  db-langfuse-data:
