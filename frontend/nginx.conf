# Jornada — SPA + proxy reverso para a API (mesma origem: sem CORS)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 320s;   # > LLM_TIMEOUT_S (300s) — agentes no hub
  }

  location /webhooks/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;   # rotas da SPA (inclui /aprovacao/:token)
  }
}
