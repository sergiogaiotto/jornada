# Config de ferramentas do monorepo (qualidade §13). Dependências: requirements.txt (§3.2).
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Padrão FastAPI: Depends/Query em default de parâmetro é o idioma do framework
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# DDL do SDD §4.1 copiado integralmente (linhas longas fazem parte do contrato)
"backend/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "integration: exige docker compose up (excluidos com -m 'not integration')",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend/app", "backend/api"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
