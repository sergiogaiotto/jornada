# CI §13 — ruff + mypy + pytest (unit/contract/aceite) + validação compose.
# Build do front e e2e compose entram quando frontend/ existir (MS3/MS8 — ver CHANGELOG-SDD.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Arma o gate de deriva de dependências (emenda F04): com esta variável,
    # `test_ambiente_instalado_e_exatamente_o_do_lock` sai do skip e confere se o que
    # está INSTALADO neste runner é exatamente o que `requirements.lock` manda. Comparar
    # lock com requirements prova só que os ARQUIVOS combinam; o que cegou o aceite
    # `E05_A7` (emenda F01) foi o AMBIENTE ter mudado sozinho.
    env:
      JORNADA_DEPS_DO_LOCK: "1"
    services:
      postgres:                    # A7 parte 1: Postgres real p/ pytest -m integration
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jornada
          POSTGRES_PASSWORD: jornada
          POSTGRES_DB: jornada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jornada -d jornada"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        # Do LOCK, não da declaração (F04): `requirements.txt` traz faixas `~=X.Y` que
        # resolvem na data do run, e o CI passava a rodar contra bibliotecas que ninguém
        # escolheu. `pytest-cov` é o único extra e entra COM `-c requirements.lock`: sem a
        # constraint, o resolvedor pode subir o próprio pytest para satisfazê-lo e o
        # ambiente sai do lock pela porta dos fundos.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -c requirements.lock pytest-cov  # somente CI (§13; não consta do §3.2)
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (unit/contract/aceite, sem integração) + cobertura >= 80%
        # --cov inclui domain e application (M1): medir só app/api mascarava o núcleo
        # DATABASE_URL fica FORA deste step: os aceites valem sobre repositório em memória
        run: >
          python -m pytest -m "not integration"
          --cov=app --cov=api --cov=domain --cov=application
          --cov-report=term-missing --cov-fail-under=80
      - name: Pytest (integração — Postgres real, A7 parte 1)
        env:
          DATABASE_URL: postgresql+asyncpg://jornada:jornada@localhost:5432/jornada
        run: python -m pytest -m integration

  # `needs: backend` NÃO é dependência lógica — é SERIALIZAÇÃO deliberada. Rodando os
  # três em paralelo, `frontend` e `compose-validate` vinham `cancelled` com ZERO steps
  # (jamais alocados a um runner) em três execuções seguidas, enquanto o `backend` — o
  # job pesado, com Postgres de serviço — passava inteiro. Job cancelado antes do "Set
  # up job" é falta de runner/cota, não falha de código, e derrubava o `deploy` (que
  # depende dos três) com a suíte verde. Em série o CI fica ~1 min mais lento e para de
  # depender da disponibilidade de três runners simultâneos.
  compose-validate:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build front (ativa quando frontend/package.json existir — MS3+)
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Skip note
        if: ${{ hashFiles('frontend/package.json') == '' }}
        run: echo "frontend ainda não iniciado (MS3+ — SDD §9)"

  # e2e-compose:   # ativar no MS8 (§13): docker compose up + Playwright jornada feliz OS-2026-0457

  deploy:
    # Deploy automático: só em push na main, só com os 3 gates verdes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose-validate]
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    steps:
      - uses: actions/checkout@v4  # o smoke funcional roda scripts/ do repo
      - name: Deploy na VPS via SSH (git pull + compose up --build)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SHA_CURTO="${GITHUB_SHA:0:7}"
          echo "GIT_SHA alvo: $SHA_CURTO"

          # RETRY SÓ DA CONEXÃO (2026-08-08). Em 6833b01 um `Connection timed out` na
          # porta 22 reprovou o deploy DEPOIS dos três gates verdes, com a VPS viva e a
          # 22 respondendo de fora do runner. Um controle que reprova por oscilação de
          # rede é o que acaba comentado — mesma razão do `esperar_api` no deploy.sh.
          #
          # A distinção que faz este retry ser seguro: `ssh` devolve 255 quando O SSH
          # falha (conexão/auth) e o código do COMANDO REMOTO quando ele roda. Só o 255
          # é retentado; um `docker compose` que falha sai com o código dele e reprova de
          # primeira, sem mascarar deploy quebrado com tentativa nova.
          #
          # Retentar é seguro mesmo se a conexão cair NO MEIO do comando: `git reset
          # --hard` + `compose up -d --build` são idempotentes — rodar de novo converge
          # para o mesmo estado.
          deploy_remoto() {
            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              root@vps.falagaiotto.com.br \
              "cd /opt/jornada && git fetch origin && git reset --hard origin/main \
               && export GIT_SHA=\$(git rev-parse HEAD | cut -c1-7) \
               && docker compose -f docker-compose.prod.yml --env-file .env up -d --build \
               && docker compose -f docker-compose.prod.yml --env-file .env ps --format '{{.Name}} {{.Status}}'"
          }

          ESPERAS="10 30"
          TENTATIVA=1
          for ESPERA in $ESPERAS "fim"; do
            # `|| CODIGO=$?` e não `if deploy_remoto`: com `set -e`, o `$?` depois de um
            # `if` cujo `then` não executou vale 0 (POSIX), e o retry nunca enxergaria o
            # 255. Esta forma também isenta a chamada do errexit.
            CODIGO=0
            deploy_remoto || CODIGO=$?
            if [ "$CODIGO" -eq 0 ]; then
              echo "deploy concluído na tentativa $TENTATIVA"
              exit 0
            fi
            if [ "$CODIGO" -ne 255 ]; then
              echo "::error::falha de DEPLOY (o comando remoto rodou e saiu $CODIGO) — não é rede, não retento"
              exit "$CODIGO"
            fi
            if [ "$ESPERA" = "fim" ]; then
              echo "::error::falha de CONEXÃO com a VPS (ssh 255) em $TENTATIVA tentativas — nada foi alterado no servidor"
              exit 1
            fi
            echo "::warning::falha de CONEXÃO (ssh 255) na tentativa $TENTATIVA — nova tentativa em ${ESPERA}s"
            sleep "$ESPERA"
            TENTATIVA=$((TENTATIVA + 1))
          done
      - name: Smoke pós-deploy (com prova de versão — A22)
        run: |
          SHA_CURTO="${GITHUB_SHA:0:7}"
          # Espera ATIVA (o 1º boot com Postgres roda `alembic upgrade head` antes de
          # servir): até 120s pelo SHA deste run responder — sleep fixo é aposta.
          SHA_NO_AR=""
          for i in $(seq 1 24); do
            SHA_NO_AR="$(curl -fsS --max-time 5 http://vps.falagaiotto.com.br:8050/healthz 2>/dev/null \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || echo "")"
            [ "$SHA_NO_AR" = "$SHA_CURTO" ] && break
            sleep 5
          done
          echo "sha no ar: '$SHA_NO_AR' · esperado: '$SHA_CURTO'"
          test "$SHA_NO_AR" = "$SHA_CURTO" || { echo "::error::deploy-fantasma: o ar responde '$SHA_NO_AR', esperado '$SHA_CURTO'"; exit 1; }
          curl -fsS -o /dev/null -w "web: HTTP %{http_code}\n" http://vps.falagaiotto.com.br:8050/
          curl -fsS http://vps.falagaiotto.com.br:8050/api/v1/os -H "X-Tenant: torre-movel" \
            -H "Authorization: Bearer dev-analista" | grep -q "OS-2026-0457" && echo "demo OK"
          echo "version-stamp OK"
      - name: Smoke FUNCIONAL pós-deploy (caminho crítico — §13)
        # O smoke acima prova a VERSÃO; este prova que a APLICAÇÃO FUNCIONA. Foi por
        # falta dele que o HTTP 500 do simulador (achado D07) ficou vivo em produção
        # com o deploy verde. Roteiro e limpeza do resíduo: scripts/smoke_funcional.py.
        # Só stdlib — nada a instalar (o python3 do runner basta).
        timeout-minutes: 5
        run: |
          python3 scripts/smoke_funcional.py \
            --base-url http://vps.falagaiotto.com.br:8050 \
            --sha "${GITHUB_SHA:0:7}"
